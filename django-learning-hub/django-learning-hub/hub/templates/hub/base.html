<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Learning Hub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="{% url 'hub:module_list' %}" class="text-xl font-bold tracking-wider">⚡ DjangoHub</a>
                </div>
                <div class="flex space-x-4">
                    <a href="{% url 'hub:module_list' %}" class="hover:bg-indigo-700 px-3 py-2 rounded-md text-sm font-medium">Learning Path</a>
                    <a href="/admin/" class="hover:bg-indigo-700 px-3 py-2 rounded-md text-sm font-medium">Admin Panel</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-gray-800 text-gray-400 text-center py-4 border-t border-gray-700 text-sm">
        &copy; 2026 Algo-Infinity-Verse | Django Learning Hub
    </footer>

</body>
</html>
